[project]
name = "claim-subsystem"
version = "2.0.0"
description = "校园失物招领 · 失物认领子系统（Django + DRF + MySQL 后端）"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "PyMySQL[rsa]>=1.1,<2.0",
    "Pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pytest-django>=4.8,<5.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
