[pytest]
minversion = 8.0
testpaths = tests
pythonpath = tests/fixtures tests/performance
addopts = -ra --strict-markers --strict-config
markers =
    integration: HTTP black-box test against the real backend
    performance_policy: offline checks of benchmark methodology
    offline: runs without the backend or MySQL
    contract_pending: behavior awaits the frozen api-contract.md
    regression_v1_0_1: strict post-fix regression added for V1.0.1
    requires_seed: needs a claim_test seed manifest
    requires_clock: needs a configured test clock seam
    slow: long-running or load-generating test
filterwarnings =
    default
