[project]
name = "claim-subsystem"
version = "1.0.0"
description = "校园失物招领 · 失物认领子系统（FastAPI + MySQL 后端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0.30,<2.1",
    "PyMySQL>=1.1,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "db: requires the isolated claim_test database (set RUN_DB_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
